services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "node /boot.cjs && exec node dist/src/cli.js serve --port 3000 --host 0.0.0.0 --self-only"]
    environment:
      PORT: "3000"
      NODE_ENV: production
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    configs:
      - source: boot_cjs
        target: /boot.cjs
      - source: dist_src_cli_js_9e3baca6
        target: /files/dist__src__cli.js
      - source: dist_src_dispatcher_js_1b2df5aa
        target: /files/dist__src__dispatcher.js
      - source: dist_src_index_js_0590f500
        target: /files/dist__src__index.js
      - source: dist_src_server_js_b6cf2f3b
        target: /files/dist__src__server.js
      - source: dist_src_signature_js_4b2db651
        target: /files/dist__src__signature.js
      - source: dist_src_templates_js_287a741d
        target: /files/dist__src__templates.js
      - source: dist_src_ui_js_d4f8eaf6
        target: /files/dist__src__ui.js
      - source: package_json_165b0514
        target: /files/package.json
configs:
  boot_cjs:
    content: |
      const fs = require('fs');
      for (const f of fs.readdirSync('/files')) {
        const target = f.split('__').join('/');
        fs.mkdirSync(require('path').dirname(target), { recursive: true });
        fs.writeFileSync(target, Buffer.from(fs.readFileSync('/files/' + f, 'utf8').replace(/\s+/g, ''), 'base64'));
      }
